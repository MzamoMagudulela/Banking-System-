version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smartbank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbank_db
      POSTGRES_USER: smartbank_user
      POSTGRES_PASSWORD: smartbank_secure_password_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbank_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=smartbank-production-docker-secret-key-change-me
      - DJANGO_DEBUG=True
      - DATABASE_URL=postgres://smartbank_user:smartbank_secure_password_demo@db:5432/smartbank_db
      - DJANGO_ALLOWED_HOSTS=*
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbank_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
